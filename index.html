    <h2>invocação do mal</h2>
<img src="https://www.adorocinema.com/filmes/filme-222796/" alt="invocacao-do-mal">
<p>Em Invocação do Mal (2013), a família Perron se muda para uma antiga fazenda isolada em Rhode Island em 1971. Logo, fenômenos aterrorizantes e paranormais começam a assustar o casal e suas cinco filhas. Desesperados, eles pedem ajuda aos renomados investigadores paranormais Ed e Lorraine Warren, que enfrentam uma poderosa e maligna entidade.</p>
